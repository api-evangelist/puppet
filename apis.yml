aid: puppet
name: Puppet
description: Puppet provides infrastructure automation and configuration management for hybrid and cloud environments.
  Puppet Enterprise exposes a collection of service APIs (Orchestrator, RBAC, Node Classifier, Code Manager, Activity,
  Status, Inventory, Value) that enable programmatic management of nodes, users, classifications, code deployments,
  and operational events.
